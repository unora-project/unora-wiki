description: Turns your magic to Water.  Every elemental spell becomes its earth counter-part, and starts on a 5s cooldown.  5 stages based on how long you hold it (0s, 45s, 105s, 210s, 360s), raising your spell damage by 8% to 50%, flat spell damage from 50 to 550, and cooldown reduction from 2% to 15%.  Attuning again is free, and ends when you die.
