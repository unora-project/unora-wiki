description: Turns your magic to Fire.  Every elemental spell becomes its earth counter-part, and starts on a 5s cooldown.  5 stages based on how long you hold it (0s, 45s, 105s, 210s, 360s), raising your spell damage by 5% to 30%, flat spell damage from 40 to 400.  Attuning again is free, and ends when you die.
